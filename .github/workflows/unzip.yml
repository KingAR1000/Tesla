name: Unzip and Cleanup

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  unzip-and-cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip the file to root
        run: |
          tmp_dir=$(mktemp -d)
          unzip -o tesla_roadster_2020.zip -d "$tmp_dir"

          # If the zip contained a single top-level folder, move its contents up
          shopt -s dotglob nullglob
          entries=("$tmp_dir"/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            mv "${entries[0]}"/* .
          else
            mv "$tmp_dir"/* .
          fi

          rm -rf "$tmp_dir"

      - name: Delete the zip file
        run: |
          rm tesla_roadster_2020.zip

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Unzip tesla_roadster_2020.zip to root and remove archive" || echo "No changes to commit"
          git push
